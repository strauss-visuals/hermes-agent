name: Diag tests-js
on:
  push:
    branches: [ci/diag-tests-js]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Set up the locked JS build toolchain
        id: node
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Install zsh and a virtual display for Electron
        run: |
          sudo apt-get install -y zsh xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: tests-js check under load
        run: |
          cd tests-js
          for i in 1 2 3 4; do (timeout 900 sh -c 'while :; do :; done' &) ; done
          for step in typecheck test lint; do
            rc=0; npm run $step > /tmp/$step.log 2>&1 || rc=$?; echo "== $step exit $rc"
            grep -v ExperimentalWarning /tmp/$step.log | grep -v trace-warnings | grep -nE "FAIL|Error|error|✗|×|expected|Timeout|timed out" | head -40 || true
            if [ $rc != 0 ]; then grep -v ExperimentalWarning /tmp/$step.log | grep -v trace-warnings | tail -60; fi
          done
          exit 0
